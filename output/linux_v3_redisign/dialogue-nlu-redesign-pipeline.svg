<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" width="100%" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img">
<title>Linux V3 NLU：现有边界与可选增强</title>
<desc>选定真实 backend 的概念流程，不是 BUILD 依赖图。失败分支不经过成功提交；模型结果先进入既有业务和历史准入。</desc>
<rect width="1000" height="930" fill="#16191f"/>
<defs><marker id="pipeline-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#85B7EB" stroke-width="1.5"/></marker></defs>
<text x="40" y="42" font-size="22" fill="#EDEDF2">Linux V3 NLU · 保留现有 owner 的增量方向</text>
<text x="40" y="72" font-size="14" fill="#B4B2A9">PARTIAL · 真实 backend 路径示意；hotfix/mock 为 Manager 独立分支，不必调用模型</text>
<rect x="40" y="100" width="620" height="95" rx="9" fill="#1F242C" stroke="#85B7EB"/>
<text x="56" y="127" font-size="16" fill="#85B7EB">① 历史投影 → BuildRequest</text>
<text x="56" y="151" font-size="14" fill="#B4B2A9">既有 policy 选择历史；codec 消费本次 NluLlmRequest.histories。</text>
<text x="56" y="172" font-size="14" fill="#B4B2A9">profile + descriptor 构造请求；不另读存储、不新建会话缓存。</text>
<rect x="40" y="235" width="620" height="95" rx="9" fill="#1F242C" stroke="#85B7EB"/>
<text x="56" y="262" font-size="16" fill="#85B7EB">② 选定 backend · 单次调用</text>
<text x="56" y="286" font-size="14" fill="#B4B2A9">HTTP 解包 envelope；offline 按宿主合同收集有界文本。</text>
<text x="56" y="307" font-size="14" fill="#B4B2A9">生成约束仅在 backend 能力确认后评估，不默认启用。</text>
<rect x="40" y="370" width="620" height="115" rx="9" fill="#1F242C" stroke="#85B7EB"/>
<text x="56" y="397" font-size="16" fill="#85B7EB">③ 共享 codec 严格解析</text>
<text x="56" y="421" font-size="14" fill="#B4B2A9">nlu_10：single / unknown / multi；按精确分隔风格解析。</text>
<text x="56" y="442" font-size="14" fill="#B4B2A9">全部帧合法后返回规范化语义；不发布残缺子集。</text>
<text x="56" y="463" font-size="14" fill="#B4B2A9">grammar 不能替代格式验证，也不能证明业务可执行。</text>
<rect x="40" y="525" width="620" height="95" rx="9" fill="#1F242C" stroke="#97C459"/>
<text x="56" y="552" font-size="16" fill="#97C459">④ 既有语义 / DM / AfterProcess</text>
<text x="56" y="576" font-size="14" fill="#B4B2A9">业务接受与历史准入继续由既有外层负责。</text>
<text x="56" y="597" font-size="14" fill="#B4B2A9">解析通过不是动作许可，也不是 Query 历史提交许可。</text>
<rect x="40" y="660" width="620" height="115" rx="9" fill="#1F242C" stroke="#97C459"/>
<text x="56" y="687" font-size="16" fill="#97C459">⑤ 既有完成与存储边界</text>
<text x="56" y="711" font-size="14" fill="#B4B2A9">按既有条件处理 Turn 与合格 Query 的存储及失败结果。</text>
<text x="56" y="732" font-size="14" fill="#B4B2A9">所需状态/历史工作结束并释放 session 所有权，才是轮次完成。</text>
<text x="56" y="753" font-size="14" fill="#B4B2A9">首个流式片段、模型返回或解析成功均不等于完成。</text>
<rect x="710" y="245" width="250" height="240" rx="9" fill="#1F242C" stroke="#FAC775"/>
<text x="726" y="272" font-size="16" fill="#FAC775">统一兜底 · 保留原因</text>
<text x="726" y="296" font-size="14" fill="#B4B2A9">格式错 / 超时 → DM 兜底</text>
<text x="726" y="317" font-size="14" fill="#B4B2A9">unknown → 同一 DM 兜底</text>
<text x="726" y="338" font-size="14" fill="#B4B2A9">保留原因，不伪造模型输出</text>
<text x="726" y="359" font-size="14" fill="#B4B2A9">取消不默认进入 DM</text>
<text x="726" y="380" font-size="14" fill="#B4B2A9">失败计数，不自动重试</text>
<text x="726" y="401" font-size="14" fill="#B4B2A9">保留原始原因和调用时限</text>
<text x="726" y="422" font-size="14" fill="#B4B2A9">不自行写入伪造成功语义</text>
<path d="M350 195 V232" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>
<path d="M350 330 V367" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>
<path d="M350 485 V522" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>
<path d="M350 620 V657" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>
<path d="M660 280 H707" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>
<path d="M660 425 H707" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>
<rect x="40" y="815" width="920" height="86" rx="9" fill="#1F242C" stroke="#85B7EB"/>
<text x="56" y="842" font-size="16" fill="#85B7EB">线程与证据边界</text>
<text x="56" y="866" font-size="14" fill="#B4B2A9">同 session 正常轮次不重叠；不同 session 可并发。QueryGuard 是内容检查，不是并发锁。</text>
<text x="56" y="887" font-size="14" fill="#B4B2A9">本图依据文档基线；不证明部署选择、引擎取消能力、全局 request_id 唯一或 exactly-once。</text>
</svg>
