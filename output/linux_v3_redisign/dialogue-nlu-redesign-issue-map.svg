<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 870" width="100%" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img">
<title>Linux V3 NLU：文档校准与待评估项</title>
<desc>PARTIAL：基于固定修订的本地参考文档；不是已确认的生产故障分级。七项分别区分基线纠正和可选增强。</desc>
<rect width="900" height="870" fill="#16191f"/>
<defs><marker id="issue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#85B7EB" stroke-width="1.5"/></marker></defs>
<text x="40" y="42" font-size="22" fill="#EDEDF2">Linux V3 NLU · 先校准基线，再评估增强</text>
<text x="40" y="72" font-size="14" fill="#B4B2A9">PARTIAL · 文档对照，不代表当前部署；建议不等于实施批准</text>
<rect x="40" y="100" width="400" height="145" rx="9" fill="#1F242C" stroke="#85B7EB"/>
<text x="56" y="127" font-size="16" fill="#85B7EB">01 · wire 格式需纠正</text>
<text x="56" y="151" font-size="14" fill="#B4B2A9">nlu_10 是 TAB 分列文本，不是 JSON 体。</text>
<text x="56" y="172" font-size="14" fill="#B4B2A9">约束生成应匹配现有 descriptor。</text>
<text x="56" y="193" font-size="14" fill="#B4B2A9">当前保留 nlu_10，不新增 JSON codec。</text>
<rect x="460" y="100" width="400" height="145" rx="9" fill="#1F242C" stroke="#85B7EB"/>
<text x="476" y="127" font-size="16" fill="#85B7EB">02 · 后端能力不能由接口推断</text>
<text x="476" y="151" font-size="14" fill="#B4B2A9">OpenAI-compatible ≠ llama-server。</text>
<text x="476" y="172" font-size="14" fill="#B4B2A9">offline hook ≠ 指定 llama.cpp SDK。</text>
<text x="476" y="193" font-size="14" fill="#B4B2A9">Linux 改善不强制 Android 换引擎。</text>
<rect x="40" y="265" width="400" height="145" rx="9" fill="#1F242C" stroke="#FAC775"/>
<text x="56" y="292" font-size="16" fill="#FAC775">03 · NLU 失败统一进入 DM 兜底</text>
<text x="56" y="316" font-size="14" fill="#B4B2A9">unknown、格式错、超时共用 DM 兜底。</text>
<text x="56" y="337" font-size="14" fill="#B4B2A9">保留原始原因；取消独立终止。</text>
<text x="56" y="358" font-size="14" fill="#B4B2A9">不执行无效语义；历史仍按既有准入。</text>
<rect x="460" y="265" width="400" height="145" rx="9" fill="#1F242C" stroke="#85B7EB"/>
<text x="476" y="292" font-size="16" fill="#85B7EB">04 · Profile 已承载生成参数</text>
<text x="476" y="316" font-size="14" fill="#B4B2A9">temperature / top_p / top_k / max_tokens</text>
<text x="476" y="337" font-size="14" fill="#B4B2A9">已在文档基线的选定 profile 中。</text>
<text x="476" y="358" font-size="14" fill="#B4B2A9">复用现有 JSON，不另建平行配置树。</text>
<rect x="40" y="430" width="400" height="145" rx="9" fill="#1F242C" stroke="#FAC775"/>
<text x="56" y="457" font-size="16" fill="#FAC775">05 · HTTP 已有超时配置</text>
<text x="56" y="481" font-size="14" fill="#B4B2A9">connect/total timeout 已有文档依据。</text>
<text x="56" y="502" font-size="14" fill="#B4B2A9">端到端 deadline 与停止生成需另证。</text>
<text x="56" y="523" font-size="14" fill="#B4B2A9">单次调用，失败计数，不自动重试。</text>
<rect x="460" y="430" width="400" height="145" rx="9" fill="#1F242C" stroke="#85B7EB"/>
<text x="476" y="457" font-size="16" fill="#85B7EB">06 · 指标先核对覆盖再补缺口</text>
<text x="476" y="481" font-size="14" fill="#B4B2A9">复用 Timeline、日志与已有指标。</text>
<text x="476" y="502" font-size="14" fill="#B4B2A9">评估错误动作、格式失败和尾延迟。</text>
<text x="476" y="523" font-size="14" fill="#B4B2A9">终态只计一次，拒识不混入技术失败。</text>
<rect x="40" y="595" width="820" height="145" rx="9" fill="#1F242C" stroke="#FAC775"/>
<text x="56" y="622" font-size="16" fill="#FAC775">07 · 三类“候选”不可混用</text>
<text x="56" y="646" font-size="14" fill="#B4B2A9">解析风格、多意图帧、独立采样不同。</text>
<text x="56" y="667" font-size="14" fill="#B4B2A9">文档路径读取 choices[0] 的正文。</text>
<text x="56" y="688" font-size="14" fill="#B4B2A9">不由严格门推导 n 次生成成本。</text>
<rect x="40" y="770" width="820" height="78" rx="9" fill="#1F242C" stroke="#97C459"/>
<text x="56" y="797" font-size="16" fill="#97C459">保留边界</text>
<text x="56" y="821" font-size="14" fill="#B4B2A9">完整有界输出 · 整组严格解析 · 既有 DM/历史准入 · 每 session 正常轮次串行，跨 session 可并行</text>
</svg>
