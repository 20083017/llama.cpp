<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-labelledby="title desc"><title id="title">Qwen3 native experiment — artifact and evaluation data flow</title><desc id="desc">Standalone Ubuntu experiment, not production Dialogue. Solid arrows show artifacts or measured data. HTTP outcome context is separate from the fixed native comparison. The original bad case stays in all candidate inputs.</desc><rect width="1600" height="1100" fill="#f6f8fc" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52637b" /></marker></defs><style>text{font-family:system-ui,Segoe UI,Arial,sans-serif;fill:#172b43} .label{font-size:18px;fill:#52637b} .body{font-size:20px} .heading{font-size:24px;font-weight:700} .edge{fill:none;stroke:#52637b;stroke-width:3;marker-end:url(#arrow)}</style><text x="50" y="48" font-size="34">Qwen3 native experiment — artifact and evaluation data flow</text><text x="50" y="83" font-size="19">Preparation artifacts were already available; these arrows do not authorize rerunning conversion or requests.</text><rect x="50" y="120" width="310" height="150" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="70" y="154" font-size="18.88111888111888">Original checkpoint inputs</text><text x="70" y="186" font-size="19">inputs/checkpoint-8343/</text><text x="70" y="213" font-size="16.666666666666664">weights + tokenizer + template</text><text x="70" y="240" font-size="17.857142857142858">transfer/provenance manifest</text><rect x="420" y="120" width="250" height="150" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="440" y="154" font-size="23">Conversion</text><text x="440" y="186" font-size="16.90821256038647">pinned converter/source</text><text x="440" y="213" font-size="19">conversion receipt</text><text x="440" y="240" font-size="16.90821256038647">not a Python NLU server</text><rect x="730" y="120" width="260" height="150" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="750" y="154" font-size="23">Common F32 GGUF</text><text x="750" y="186" font-size="18.51851851851852">models/ + convert.json</text><text x="750" y="213" font-size="19">same source for all</text><text x="750" y="240" font-size="19">quantized candidates</text><rect x="1060" y="120" width="490" height="150" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="1080" y="154" font-size="23">Direct quantization from F32</text><text x="1080" y="186" font-size="19">retained Q8_0: models/</text><text x="1080" y="213" font-size="19">Q5_K_M / Q4_K_M: original pilot results/</text><text x="1080" y="240" font-size="19">private NFC quantizer + model receipts</text><polyline points="360,195 420,195" class="edge" /><polyline points="670,195 730,195" class="edge" /><polyline points="990,195 1060,195" class="edge" /><rect x="50" y="360" width="350" height="170" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="70" y="394" font-size="23">Frozen experiment inputs</text><text x="70" y="426" font-size="19">config snapshot: nlu_10</text><text x="70" y="453" font-size="19">16 query/history instances</text><text x="70" y="480" font-size="19">14 gold + 2 unlabeled probes</text><text x="70" y="507" font-size="19">fixtures + tokenizer/template</text><rect x="500" y="360" width="520" height="170" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="520" y="394" font-size="23">Native measurement via C++ CLI</text><text x="520" y="426" font-size="19">saved F32 / 4-thread evidence reused</text><text x="520" y="453" font-size="19">six candidates: Q8/Q5/Q4 x 2/4 threads</text><text x="520" y="480" font-size="19">16 instances per candidate; serial configs</text><text x="520" y="507" font-size="19">codec / provider / parser / reset timing</text><rect x="1120" y="360" width="430" height="170" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="1140" y="394" font-size="23">Immutable native evidence</text><text x="1140" y="426" font-size="19">all 16 outcomes per configuration</text><text x="1140" y="453" font-size="19">raw response + parsed semantics</text><text x="1140" y="480" font-size="19">gold result + Process microseconds</text><text x="1140" y="507" font-size="19">actual settings / attempts / receipts</text><polyline points="400,445 500,445" class="edge" /><polyline points="1020,445 1120,445" class="edge" /><polyline points="1305,270 1305,310 760,310 760,360" class="edge" /><rect x="50" y="650" width="420" height="160" rx="14" fill="#fff3df" stroke="#be8d37" stroke-width="2" /><text x="70" y="684" font-size="23">Saved HTTP reference</text><text x="70" y="716" font-size="19">16 requests already captured</text><text x="70" y="743" font-size="19">single/probe + sequential turn groups</text><text x="70" y="770" font-size="19">full Dialogue envelope</text><text x="70" y="797" font-size="19">different history/model boundary</text><rect x="540" y="650" width="460" height="160" rx="14" fill="#fff3df" stroke="#be8d37" stroke-width="2" /><text x="560" y="684" font-size="23">HTTP outcome context</text><text x="560" y="716" font-size="19">saved original HTTP captures</text><text x="560" y="743" font-size="19">agreement: 8/14 gold + 2 probes</text><text x="560" y="770" font-size="19">not SDK speedup or proof of</text><text x="560" y="797" font-size="19">identical loaded model / histories</text><rect x="1070" y="650" width="480" height="160" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="1090" y="684" font-size="23">Fixed native comparison</text><text x="1090" y="716" font-size="19">15 baseline-valid IDs frozen first</text><text x="1090" y="743" font-size="19">13 annotated + 2 probe cases</text><text x="1090" y="770" font-size="19">protect correct cases + probe semantics</text><text x="1090" y="797" font-size="19">same-ID median, file bytes, config ID</text><polyline points="470,730 540,730" class="edge" stroke-dasharray="9 7" /><polyline points="1335,530 1335,650" class="edge" /><text x="530" y="610" font-size="18">Separate comparison boundary</text><rect x="540" y="910" width="1010" height="145" rx="14" fill="#e9f6ef" stroke="#3e8d63" stroke-width="2" /><text x="560" y="944" font-size="23">Continuation recommendation + full case evidence</text><text x="560" y="976" font-size="19">Q5_K_M / 4 threads selected: 573.350 ms median on the fixed 15 IDs</text><text x="560" y="1003" font-size="19">partial-reference/subset-qualified only; total gold correctness remains 6/14</text><text x="560" y="1030" font-size="19">All candidates still fail the original empty-slot case. No production deployment.</text><polyline points="770,810 770,910" class="edge" stroke-dasharray="9 7" /><polyline points="1310,810 1310,910" class="edge" /><text x="50" y="1040" font-size="18">Solid: artifact / native evidence flow</text><text x="50" y="1070" font-size="18">Dashed: HTTP context only</text></svg>