<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180" role="img" aria-labelledby="title desc"><title id="title">Qwen3 native experiment — system structure and ownership</title><desc id="desc">Standalone Linux CPU architecture. Python coordinates bounded processes; native C++ owns inference. Protocol request building and response parsing are shared interfaces, not an alternative NLU implementation. Build dependencies are separate from runtime calls.</desc><rect width="1600" height="1180" fill="#f6f8fc" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52637b" /></marker></defs><style>text{font-family:system-ui,Segoe UI,Arial,sans-serif;fill:#172b43} .label{font-size:18px;fill:#52637b} .body{font-size:20px} .heading{font-size:24px;font-weight:700} .edge{fill:none;stroke:#52637b;stroke-width:3;marker-end:url(#arrow)}</style><text x="50" y="48" font-size="34">Qwen3 native experiment — system structure and ownership</text><text x="50" y="83" font-size="19">Structure view: runtime calls, shared interfaces, artifacts and build relationships are labeled separately.</text><rect x="50" y="115" width="470" height="165" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="70" y="149" font-size="23">Python experiment orchestration</text><text x="70" y="181" font-size="17.695473251028805">tools/cpu_workflow.py: seed/test/build/accept</text><text x="70" y="208" font-size="18.959435626102294">tools/cpu_tune.py: bounded tuning/continue</text><text x="70" y="235" font-size="19">immutable inputs, attempts and ranking</text><text x="70" y="262" font-size="19">no inference inside Python orchestration</text><rect x="565" y="115" width="470" height="165" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="585" y="149" font-size="23">Existing bounded execution</text><text x="585" y="181" font-size="17.695473251028805">harness-limit.py: child session, log, cleanup</text><text x="585" y="208" font-size="19">cpu_workflow executor: emergency guard</text><text x="585" y="235" font-size="19">existing allocated-disk sampler / AS cap</text><text x="585" y="262" font-size="19">no second request owner or monitor</text><rect x="1080" y="115" width="470" height="165" rx="14" fill="#fff3df" stroke="#be8d37" stroke-width="2" /><text x="1100" y="149" font-size="23">Separate HTTP reference path</text><text x="1100" y="181" font-size="19">existing single / multi-turn clients</text><text x="1100" y="208" font-size="19">selected external Dialogue endpoint</text><text x="1100" y="235" font-size="17.695473251028805">sequential turns per session; groups parallel</text><text x="1100" y="262" font-size="19">saved outcome context, not native parity</text><text x="50" y="340" font-size="21">NATIVE RUNTIME CALL CHAIN — standalone executable, not a production Dialogue service</text><rect x="50" y="385" width="330" height="175" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="70" y="419" font-size="23">C++ corpus CLI</text><text x="70" y="451" font-size="19">src/qwen3_native_test.cc</text><text x="70" y="478" font-size="17.90123456790123">owns selected request / result</text><text x="70" y="505" font-size="16.27384960718294">config + fixtures / frozen corpus</text><text x="70" y="532" font-size="19">collects per-case evidence</text><rect x="445" y="385" width="330" height="175" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="465" y="419" font-size="23">Offline NLU binding</text><text x="465" y="451" font-size="19">existing offline backend</text><text x="465" y="478" font-size="19">invokes synchronous provider</text><text x="465" y="505" font-size="19">validates returned content</text><text x="465" y="532" font-size="15.79520697167756">preserves parse / rejection status</text><rect x="840" y="385" width="330" height="175" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="860" y="419" font-size="23">Native provider</text><text x="860" y="451" font-size="19">src/native_provider.*</text><text x="860" y="478" font-size="19">selected 2/4 CPU threads</text><text x="860" y="505" font-size="17.90123456790123">per-instance context / sampler</text><text x="860" y="532" font-size="14.514514514514515">reset through existing call lifecycle</text><rect x="1235" y="385" width="315" height="175" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="1255" y="419" font-size="23">Selected llama SDK</text><text x="1255" y="451" font-size="19">sdk/llama-nfc-v6</text><text x="1255" y="478" font-size="19">native model execution</text><text x="1255" y="505" font-size="19">GGUF model + tokenizer</text><text x="1255" y="532" font-size="18.187830687830687">headers and shared libraries</text><polyline points="380,465 445,465" class="edge" /><polyline points="775,465 840,465" class="edge" /><polyline points="1170,465 1235,465" class="edge" /><polyline points="200,280 200,385" class="edge" /><text x="220" y="312" font-size="17">bounded process invocation</text><polyline points="800,280 1040,280 1040,360 350,360 350,385" class="edge" /><text x="1080" y="325" font-size="17">existing workload supervision</text><rect x="50" y="695" width="390" height="190" rx="14" fill="#f0edfc" stroke="#8270b8" stroke-width="2" /><text x="70" y="729" font-size="19.886363636363633">Shared nlu_10 protocol interface</text><text x="70" y="761" font-size="15.4320987654321">existing request builder / response parser</text><text x="70" y="788" font-size="16.203703703703702">used at actual selected codec boundaries</text><text x="70" y="815" font-size="16.203703703703702">not nlu_11; profile name is not protocol</text><text x="70" y="842" font-size="19">empty slot remains a parse error</text><text x="70" y="869" font-size="15.4320987654321">original failure is reported, not repaired</text><polyline points="180,560 180,695" class="edge" /><polyline points="600,560 600,640 400,640 400,695" class="edge" /><text x="460" y="618" font-size="17">shared codec interfaces</text><rect x="505" y="695" width="445" height="190" rx="14" fill="#eaf2ff" stroke="#5484bd" stroke-width="2" /><text x="525" y="729" font-size="23">Explicit artifact ownership</text><text x="525" y="761" font-size="19">inputs/: checkpoint and template</text><text x="525" y="788" font-size="18.75">models/ + pilot results/: GGUF artifacts</text><text x="525" y="815" font-size="19">config/ + fixtures/: selected contracts</text><text x="525" y="842" font-size="17.857142857142858">results/: immutable rows, receipts, choice</text><text x="525" y="869" font-size="19">logs/: existing supervisor diagnostics</text><polyline points="1370,560 1370,615 900,615 900,695" class="edge" /><text x="1030" y="640" font-size="17">model / evidence relationships</text><rect x="1015" y="695" width="535" height="190" rx="14" fill="#fff3df" stroke="#be8d37" stroke-width="2" /><text x="1035" y="729" font-size="23">Build plane — NOT runtime stage order</text><text x="1035" y="761" font-size="19">BUILD + sdk_selection.bzl select dependencies</text><text x="1035" y="788" font-size="19">canonical controller → isolated build/harness.*</text><text x="1035" y="815" font-size="19">upstream source → CMake SDK / quantizer build</text><text x="1035" y="842" font-size="19">fresh receipt pins ELF, SDK and actual inputs</text><text x="1035" y="869" font-size="19">file presence alone does not activate a backend</text><polyline points="1035,800 950,800" class="edge" stroke-dasharray="9 7" /><text x="1050" y="918" font-size="17">Dashed edge: artifact/build relationship, not a runtime call</text><rect x="50" y="975" width="1500" height="150" rx="14" fill="#e9f6ef" stroke="#3e8d63" stroke-width="2" /><text x="70" y="1009" font-size="23">Preserved ownership and scope</text><text x="70" y="1041" font-size="19">Native configurations execute serially; the provider is not a shared concurrent service.</text><text x="70" y="1068" font-size="19">Different HTTP sessions may overlap, but normal turns within one session remain sequential.</text><text x="70" y="1095" font-size="19">No new history manager, request registry, logging framework, production deployment, Android runtime or GPU implementation is introduced.</text></svg>